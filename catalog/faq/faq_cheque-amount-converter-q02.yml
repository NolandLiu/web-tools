locales:
  - locale: en
    question: "Will a third decimal digit be rounded?"
    answer: "No. Inputs with more than two decimal places are rejected."
  - locale: zh-CN
    question: "第三位小数会四舍五入吗？"
    answer: "不会，超过两位小数的输入会被拒绝。"
  - locale: zh-TW
    question: "第三位小數會四捨五入嗎？"
    answer: "不會，超過兩位小數的輸入會被拒絕。"
